services:
  - type: web
    name: yusr-platform
    runtime: node
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 5000
