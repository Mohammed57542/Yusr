<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مِحــور</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'Aniq';
      src: url('aa-aniq-bold.otf') format('opentype');
      font-weight: bold;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --teal-dark: #285F56;
      --teal-medium: #4F7B74;
      --teal-light: #8FAEAA;
      --white: #FFFFFF;
      --off-white: #F7FAF9;
      --gray-soft: #E8EDEB;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Almarai', 'Montserrat', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--off-white);
      padding: 24px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: -120px;
      left: -120px;
      width: 350px;
      height: 350px;
      border: 1.5px solid var(--teal-light);
      border-radius: 50%;
      opacity: 0.25;
    }

    body::after {
      content: '';
      position: absolute;
      bottom: -80px;
      right: -80px;
      width: 260px;
      height: 260px;
      border: 1.5px solid var(--teal-light);
      border-radius: 50%;
      opacity: 0.2;
    }

    .geo-tl { position: fixed; top: 30px; left: 30px; z-index: 0; }
    .geo-tl .line { position: absolute; background: var(--teal-light); opacity: 0.2; }
    .geo-tl .line-1 { width: 80px; height: 1.5px; top: 0; left: 0; transform: rotate(-25deg); }
    .geo-tl .line-2 { width: 55px; height: 1.5px; top: 18px; left: 10px; transform: rotate(-25deg); }
    .geo-tl .line-3 { width: 35px; height: 1.5px; top: 36px; left: 20px; transform: rotate(-25deg); }
    .geo-tl .dot { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--teal-medium); opacity: 0.3; top: -4px; left: 82px; }
    .geo-tl .rect { position: absolute; width: 14px; height: 14px; border: 1.5px solid var(--teal-light); opacity: 0.2; top: 48px; left: 0; transform: rotate(45deg); }

    .geo-br { position: fixed; bottom: 30px; right: 30px; z-index: 0; }
    .geo-br .line { position: absolute; background: var(--teal-light); opacity: 0.2; }
    .geo-br .line-1 { width: 70px; height: 1.5px; bottom: 0; right: 0; transform: rotate(30deg); }
    .geo-br .line-2 { width: 50px; height: 1.5px; bottom: 16px; right: 12px; transform: rotate(30deg); }
    .geo-br .line-3 { width: 30px; height: 1.5px; bottom: 32px; right: 24px; transform: rotate(30deg); }
    .geo-br .dot { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: var(--teal-medium); opacity: 0.3; bottom: -3px; right: 72px; }
    .geo-br .rect { position: absolute; width: 12px; height: 12px; border: 1.5px solid var(--teal-light); opacity: 0.2; bottom: 44px; right: 0; transform: rotate(45deg); }

    .geo-tr { position: fixed; top: 40px; right: 40px; z-index: 0; }
    .geo-tr .circle-outline { width: 40px; height: 40px; border: 1.5px solid var(--teal-light); border-radius: 50%; opacity: 0.15; }
    .geo-tr .circle-filled { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--teal-medium); opacity: 0.25; top: 16px; left: -20px; }

    .geo-bl { position: fixed; bottom: 50px; left: 40px; z-index: 0; }
    .geo-bl .h-line { width: 45px; height: 1.5px; background: var(--teal-light); opacity: 0.18; }
    .geo-bl .v-line { position: absolute; width: 1.5px; height: 45px; background: var(--teal-light); opacity: 0.18; top: -45px; left: 0; }

    .lang-toggle {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 100;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1.5px solid var(--gray-soft);
      background: var(--white);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--teal-dark);
      font-family: 'Montserrat', sans-serif;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(40,95,86,0.08);
    }

    .lang-toggle:hover {
      border-color: var(--teal-medium);
      background: var(--teal-dark);
      color: var(--white);
    }

    .lang-toggle:hover svg { fill: var(--white); }

    .lang-toggle svg {
      width: 18px;
      height: 18px;
      fill: var(--teal-dark);
      transition: fill 0.3s ease;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: var(--white);
      border-radius: 20px;
      padding: 48px 36px 40px;
      text-align: center;
      position: relative;
      z-index: 1;
      box-shadow: 0 1px 3px rgba(40,95,86,0.04), 0 8px 32px rgba(40,95,86,0.06);
    }

    .card::before {
      content: '';
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 2.5px;
      background: var(--teal-dark);
      border-radius: 2px;
    }

    .logo-mark {
      width: 100px;
      height: 100px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-mark img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* MIHWR BRAND — مِحــور | MIHWR */
    .title {
      font-family: 'Aniq', 'Montserrat', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--teal-dark);
      margin-bottom: 6px;
      letter-spacing: -0.3px;
      display: flex;
      justify-content: center;
      align-items: center;
      direction: rtl !important;
      unicode-bidi: isolate;
      text-align: center;
      white-space: nowrap;
      gap: 0;
    }
    .title .brand-ar {
      direction: rtl !important;
      unicode-bidi: isolate !important;
      display: block;
    }
    .title .brand-separator {
      direction: ltr !important;
      unicode-bidi: isolate !important;
      display: block;
      margin: 0 4px;
    }
    .title .brand-en {
      direction: ltr !important;
      unicode-bidi: isolate !important;
      display: block;
    }
    html[dir="rtl"] .title,
    html[dir="ltr"] .title {
      direction: rtl !important;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--teal-light);
      font-weight: 400;
      margin-bottom: 36px;
      line-height: 1.6;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .divider .line { flex: 1; height: 1px; background: var(--gray-soft); }
    .divider .diamond { width: 6px; height: 6px; background: var(--teal-medium); transform: rotate(45deg); opacity: 0.4; }

    .links { display: flex; flex-direction: column; gap: 14px; }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 22px;
      border: 1.5px solid var(--gray-soft);
      border-radius: 14px;
      text-decoration: none;
      color: var(--teal-dark);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      background: var(--white);
    }

    .link-btn:hover {
      border-color: var(--teal-medium);
      background: var(--off-white);
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(40,95,86,0.08);
    }

    .link-btn .icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: var(--off-white);
      border: 1px solid var(--gray-soft);
      transition: all 0.3s ease;
    }

    .link-btn:hover .icon-box { background: var(--teal-dark); border-color: var(--teal-dark); }
    .link-btn .icon-box svg { width: 20px; height: 20px; fill: var(--teal-medium); transition: fill 0.3s ease; }
    .link-btn:hover .icon-box svg { fill: var(--white); }

    .link-btn .text { flex: 1; text-align: right; }
    .link-btn .text .label { display: block; font-size: 0.95rem; font-weight: 700; color: var(--teal-dark); margin-bottom: 2px; }
    .link-btn .text .desc { display: block; font-size: 0.75rem; font-weight: 400; color: var(--teal-light); }

    .link-btn .arrow { width: 20px; height: 20px; fill: var(--teal-light); transition: all 0.3s ease; flex-shrink: 0; }
    .link-btn:hover .arrow { fill: var(--teal-dark); transform: translateX(-3px); }

    .footer {
      margin-top: 36px;
      padding-top: 20px;
      border-top: 1px solid var(--gray-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .footer .dash { width: 16px; height: 1.5px; background: var(--teal-light); opacity: 0.4; }
    .footer span { font-size: 0.7rem; color: var(--teal-light); font-weight: 400; letter-spacing: 0.5px; }

    html[dir="ltr"] .link-btn .text { text-align: left; }
    html[dir="ltr"] .card { text-align: center; }

    @media (max-width: 480px) {
      body { padding: 16px; overflow: auto; }
      .card { padding: 36px 20px 28px; border-radius: 16px; }
      .logo-mark { width: 80px; height: 80px; }
      .title { font-size: 1.25rem; }
      .subtitle { font-size: 0.8rem; margin-bottom: 28px; }
      .divider { margin-bottom: 24px; }
      .links { gap: 12px; }
      .link-btn { padding: 14px 16px; gap: 12px; border-radius: 12px; }
      .link-btn .icon-box { width: 40px; height: 40px; border-radius: 10px; }
      .link-btn .icon-box svg { width: 18px; height: 18px; }
      .link-btn .text .label { font-size: 0.88rem; }
      .link-btn .text .desc { font-size: 0.7rem; }
      .link-btn .arrow { width: 18px; height: 18px; }
      .geo-tl, .geo-br, .geo-tr, .geo-bl { display: none; }
      body::before, body::after { display: none; }
      .lang-toggle { top: 12px; left: 12px; width: 42px; height: 42px; }
    }
  </style>
</head>
<body>

    <div class="footer">

      <span data-ar="لأجل طاقةٍ أنظف ومستقبلٍ مستدام" data-en="For a cleaner energy and a sustainable future">لأجل طاقةٍ أنظف ومستقبلٍ مستدام</span>
      <div class="dash"></div>
    </div>
  </div>

  <script>
    let currentLang = 'ar';

    function toggleLang() {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      const html = document.documentElement;

      if (currentLang === 'en') {
        html.setAttribute('dir', 'ltr');
        html.setAttribute('lang', 'en');
      } else {
        html.setAttribute('dir', 'rtl');
        html.setAttribute('lang', 'ar');
      }

      document.querySelectorAll('[data-ar]').forEach(el => {
        el.textContent = el.getAttribute('data-' + currentLang);
      });

      // Never change the brand text or its direction when switching languages.
      const brand = document.querySelector('.title');
      if (brand) {
        brand.setAttribute('dir', 'rtl');
        brand.style.direction = 'rtl';
      }
    }
  </script>

</body>
</html>
